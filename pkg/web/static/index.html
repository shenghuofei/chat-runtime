<!DOCTYPE html>
<!-- chat-runtime Web 前端：单文件自包含（CSS/JS 全部内联），通过 go:embed 内嵌进二进制 -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>chat-runtime</title>

  <!-- Markdown 渲染 & 代码高亮（本地 vendor，离线可用） -->
  <link rel="stylesheet" href="/vendor/atom-one-dark.min.css" />
  <script src="/vendor/marked.min.js" defer></script>
  <script src="/vendor/highlight.min.js" defer></script>

  <style>
    :root {
      --bg: #1a1b1e;
      --bg-elevated: #25262b;
      --bg-input: #2c2e33;
      --bg-code: #16171a;
      --border: #373a40;
      --text: #e9ecef;
      --text-dim: #909296;
      --accent: #4dabf7;
      --accent-hover: #339af0;
      --user-bubble: #2b3a55;
      --assistant-bubble: #25262b;
      --danger: #ff6b6b;
      --success: #51cf66;
      --warning: #ffd43b;

      /* 各类型块的语义色 */
      --think-bg: #172519;
      --think-border: #3fae5a;
      --think-text: #8fdba0;
      --tool-bg: #241f14;
      --tool-border: #e6a23c;
      --tool-text: #f2c76b;
      --tool-result-bg: #1c1d20;
      --tool-result-border: #4a4d52;
      --tool-result-text: #b8bcc2;
      --approval-bg: #2a1d12;
      --approval-border: #ff922b;
      --approval-text: #ffb066;

      --radius: 12px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
              "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
      --mono: "SF Mono", Menlo, Consolas, "Roboto Mono", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--font); background: var(--bg); color: var(--text);
      display: flex; flex-direction: column; height: 100vh; overflow: hidden;
    }

    /* ===== 顶部栏 ===== */
    header {
      display: flex; align-items: center; gap: 16px;
      padding: 12px 20px; background: var(--bg-elevated);
      border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    header .title { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    header .status { font-size: 12px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; }
    header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); transition: background .2s; }
    header .dot.online { background: var(--success); box-shadow: 0 0 6px var(--success); }
    header .dot.offline { background: var(--danger); }
    header .spacer { flex: 1; }
    header .actions { display: flex; gap: 8px; }
    header select {
      background: var(--bg-input); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 5px 10px; font-size: 13px; font-family: var(--font);
      cursor: pointer; outline: none;
    }
    header select:hover { border-color: var(--text-dim); }

    /* ===== 主体消息区 ===== */
    main { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    .messages { width: 100%; max-width: 860px; display: flex; flex-direction: column; gap: 18px; }

    .msg { display: flex; gap: 12px; animation: fade 0.2s ease; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .msg .avatar {
      width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 600;
    }
    .msg.user .avatar { background: var(--user-bubble); color: var(--accent); }
    .msg.assistant .avatar { background: var(--accent); color: #fff; }

    .msg .content-wrap { flex: 1; min-width: 0; }

    .msg .meta {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 4px; font-size: 12px; color: var(--text-dim);
    }
    .msg .meta .role { font-weight: 600; color: var(--text); }

    .msg .bubble {
      background: var(--assistant-bubble); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 12px 16px;
      max-width: 100%; overflow-x: auto; line-height: 1.6; word-break: break-word;
    }
    .msg.user .bubble { background: var(--user-bubble); border-color: transparent; }

    /* 正文 Markdown 内容（白色调） */
    .md-content { border-left: 3px solid transparent; }
    .bubble p { margin: 6px 0; }
    .bubble p:first-child { margin-top: 0; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble ul, .bubble ol { margin: 6px 0 6px 20px; }
    .bubble a { color: var(--accent); }
    .bubble table { border-collapse: collapse; margin: 8px 0; }
    .bubble th, .bubble td { border: 1px solid var(--border); padding: 6px 10px; }
    .bubble blockquote { border-left: 3px solid var(--accent); padding-left: 12px; color: var(--text-dim); margin: 8px 0; }
    .bubble h1, .bubble h2, .bubble h3 { margin: 12px 0 6px; line-height: 1.3; }

    /* ===== 通用可折叠块（thinking / tool 共用外观骨架）===== */
    details.block { border-radius: 8px; margin: 10px 0; overflow: hidden; border: 1px solid var(--border); border-left-width: 3px; }
    details.block > summary {
      cursor: pointer; padding: 9px 12px; font-size: 13px; font-weight: 500;
      display: flex; align-items: center; gap: 8px; list-style: none; user-select: none;
    }
    details.block > summary::-webkit-details-marker { display: none; }
    /* 展开/收起箭头指示器 */
    details.block > summary .arrow {
      display: inline-block; transition: transform .18s ease; font-size: 10px; color: currentColor; opacity: .8;
    }
    details.block[open] > summary .arrow { transform: rotate(90deg); }
    details.block > summary .icon { font-size: 14px; line-height: 1; }
    details.block > summary .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    details.block > summary .meta-right { font-size: 11px; color: var(--text-dim); font-weight: 400; flex-shrink: 0; }

    /* ===== Thinking 折叠块（绿色调，💭）===== */
    .thinking-block { border-color: var(--think-border); background: var(--think-bg); }
    .thinking-block > summary { color: var(--think-text); }
    .thinking-block .thinking-content {
      padding: 4px 12px 10px 32px; font-size: 13px; color: var(--think-text);
      line-height: 1.6; white-space: pre-wrap; word-break: break-word;
      max-height: 320px; overflow-y: auto;
    }

    /* ===== 工具调用折叠块（黄/橙色调，🔧）===== */
    .tool-block { border-color: var(--tool-border); background: var(--tool-bg); }
    .tool-block > summary { color: var(--tool-text); }
    .tool-block .tool-body { padding: 2px 12px 12px 32px; font-size: 12px; }
    .tool-block .section-label {
      color: var(--text-dim); font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .04em; margin: 10px 0 4px; display: flex; align-items: center; gap: 6px;
    }
    .tool-block .section-label::before { content: ""; width: 3px; height: 12px; border-radius: 2px; background: var(--tool-border); }
    .tool-block pre.args {
      background: var(--bg-code); padding: 10px; border-radius: 6px;
      white-space: pre-wrap; word-break: break-all; margin: 0;
      font-family: var(--mono); font-size: 12px; line-height: 1.5;
      border: 1px solid var(--border);
    }

    /* ===== 工具结果块（嵌套，灰色调）===== */
    .tool-block .tool-result {
      background: var(--tool-result-bg); border: 1px solid var(--tool-result-border);
      border-left: 3px solid var(--tool-result-border); border-radius: 6px;
      padding: 10px; margin: 0; color: var(--tool-result-text);
      white-space: pre-wrap; word-break: break-all;
      font-family: var(--mono); font-size: 12px; line-height: 1.5;
      max-height: 360px; overflow: auto;
    }
    .tool-block .result-section[hidden] { display: none; }
    .tool-block .result-label::before { background: var(--tool-result-border); }

    /* ===== 审批块（橙色警告调，⚠️）===== */
    .approval {
      border: 1px solid var(--approval-border); border-left: 3px solid var(--approval-border);
      border-radius: 8px; margin: 10px 0; padding: 12px 14px; background: var(--approval-bg);
    }
    .approval .head { color: var(--approval-text); font-weight: 600; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .approval .section-label {
      color: var(--text-dim); font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .04em; margin: 8px 0 4px;
    }
    .approval pre {
      background: var(--bg-code); padding: 10px; border-radius: 6px; border: 1px solid var(--border);
      font-family: var(--mono); font-size: 12px; white-space: pre-wrap; word-break: break-all; margin: 0;
    }
    .approval .btns { display: flex; gap: 10px; margin-top: 12px; }

    /* ===== 代码块 + 复制按钮 + 语言标签 ===== */
    .code-block { position: relative; margin: 10px 0; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
    .code-block .code-header {
      display: flex; align-items: center; justify-content: space-between;
      background: #101114; padding: 6px 12px; font-size: 12px; color: var(--text-dim);
    }
    .code-block .code-header .lang { text-transform: uppercase; font-weight: 600; letter-spacing: .05em; font-size: 11px; }
    .code-block .copy-btn {
      background: transparent; border: 1px solid var(--border); color: var(--text-dim);
      border-radius: 4px; padding: 2px 10px; font-size: 11px; cursor: pointer; transition: all .15s;
    }
    .code-block .copy-btn:hover { color: var(--text); border-color: var(--text-dim); }
    .code-block .copy-btn.copied { color: var(--success); border-color: var(--success); }
    .code-block pre { background: var(--bg-code); padding: 12px; overflow-x: auto; font-size: 13px; margin: 0; }
    .code-block pre code { font-family: var(--mono); font-size: 13px; }
    /* 行内 code */
    .bubble :not(pre) > code {
      background: var(--bg-code); padding: 2px 6px; border-radius: 4px;
      font-family: var(--mono); font-size: 13px;
    }

    /* 流式光标 */
    .cursor::after { content: "▋"; color: var(--accent); animation: blink 1s steps(2) infinite; margin-left: 1px; }
    @keyframes blink { 50% { opacity: 0; } }

    /* ===== 底部输入区 ===== */
    footer {
      flex-shrink: 0; padding: 14px 20px 20px;
      background: var(--bg); display: flex; justify-content: center;
    }
    .composer {
      width: 100%; max-width: 860px; display: flex; gap: 10px; align-items: flex-end;
      background: var(--bg-input); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 8px 8px 8px 14px;
    }
    .composer:focus-within { border-color: var(--accent); }
    .composer textarea {
      flex: 1; resize: none; border: none; outline: none;
      background: transparent; color: var(--text);
      font-family: var(--font); font-size: 15px; line-height: 1.5;
      max-height: 200px; padding: 6px 0;
    }
    .composer textarea::placeholder { color: var(--text-dim); }

    /* ===== 按钮 ===== */
    button {
      font-family: var(--font); cursor: pointer; border: none; border-radius: 8px;
      padding: 8px 14px; font-size: 14px; font-weight: 500;
      transition: background 0.15s, opacity 0.15s, border-color .15s, color .15s;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-ghost { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }
    .btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--text-dim); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-success { background: var(--success); color: #16171a; }
    .send-btn { padding: 8px 12px; }
    .hint { font-size: 11px; color: var(--text-dim); text-align: center; margin-top: 8px; }

    @media (max-width: 640px) {
      header { padding: 10px 14px; gap: 10px; }
      main { padding: 14px; }
      footer { padding: 10px 14px 16px; }
      .msg .avatar { width: 28px; height: 28px; }
      header .actions button span { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="title">💬 chat-runtime</div>
    <select id="chatSelect" title="切换对话预设">
      <option value="default">default</option>
    </select>
    <div class="status">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">连接中…</span>
    </div>
    <div class="spacer"></div>
    <div class="actions">
      <button class="btn-ghost" id="newBtn" title="开启新对话">✚ <span>新对话</span></button>
      <button class="btn-danger" id="stopBtn" disabled title="停止生成">⏹ <span>停止</span></button>
      <button class="btn-ghost" id="clearBtn" title="清空对话">🗑 <span>清空</span></button>
    </div>
  </header>

  <main id="main">
    <div class="messages" id="messages"></div>
  </main>

  <footer>
    <div style="width:100%;max-width:860px;">
      <div class="composer">
        <textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行…"></textarea>
        <button class="btn-primary send-btn" id="sendBtn" title="发送">➤</button>
      </div>
      <div class="hint">Enter 发送 · Shift+Enter 换行 · chat-runtime</div>
    </div>
  </footer>

  <script>
    // ============================================================
    // chat-runtime 前端
    // ============================================================

    const $messages = document.getElementById('messages');
    const $main = document.getElementById('main');
    const $input = document.getElementById('input');
    const $sendBtn = document.getElementById('sendBtn');
    const $stopBtn = document.getElementById('stopBtn');
    const $clearBtn = document.getElementById('clearBtn');
    const $newBtn = document.getElementById('newBtn');
    const $statusDot = document.getElementById('statusDot');
    const $statusText = document.getElementById('statusText');
    const $chatSelect = document.getElementById('chatSelect');

    let ws = null;
    let reconnectDelay = 1000;
    let generating = false;
    let currentBubble = null;   // 当前 assistant bubble 元素
    let currentRaw = '';        // 当前正文（非 thinking）累积原文

    // 每个 chat 预设使用独立的 sessionId（key: cr_session_<chatName>），
    // 切换预设时自动切换到对应会话历史。
    // 兼容迁移：若旧版 cr_session 存在，迁移到 cr_session_default 后删除旧 key。
    function getSessionId(chatName) {
      const key = 'cr_session_' + (chatName || 'default');
      let id = localStorage.getItem(key);
      if (!id) {
        if (!chatName || chatName === 'default') {
          const legacy = localStorage.getItem('cr_session');
          if (legacy) { localStorage.setItem(key, legacy); localStorage.removeItem('cr_session'); id = legacy; }
        }
        if (!id) {
          id = crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random();
          localStorage.setItem(key, id);
        }
      }
      return id;
    }

    function getChatName() {
      return localStorage.getItem('cr_chat') || 'default';
    }

    // 从 /api/chats 加载可用对话预设并填充下拉框
    async function loadChats() {
      try {
        const res = await fetch('/api/chats');
        if (!res.ok) return;
        const data = await res.json();
        const chats = data.chats || [];
        if (chats.length === 0) return;
        $chatSelect.innerHTML = chats.map(c =>
          `<option value="${escapeAttr(c)}">${escapeHtml(c)}</option>`
        ).join('');
        const saved = getChatName();
        if (chats.includes(saved)) $chatSelect.value = saved;
        else $chatSelect.value = chats[0];
        localStorage.setItem('cr_chat', $chatSelect.value);
      } catch (_) {}
    }

    $chatSelect.addEventListener('change', (e) => {
      localStorage.setItem('cr_chat', e.target.value);
      // 清理当前生成状态，避免 UI 按钮卡住
      finishGenerating();
      // 清空消息列表，切换到新对话预设后从空白开始
      $messages.innerHTML = '';
      // 重新连接 WebSocket；先置空 onclose 防止自动重连旧 chat
      if (ws) { ws.onclose = null; ws.close(); }
      ws = null;
      reconnectDelay = 1000;
      connect();
    });

    // ---- 时间格式化 ----
    function formatTime(date) {
      const d = date || new Date();
      const h = String(d.getHours()).padStart(2, '0');
      const m = String(d.getMinutes()).padStart(2, '0');
      const s = String(d.getSeconds()).padStart(2, '0');
      return `${h}:${m}:${s}`;
    }

    // ============================================================
    // WebSocket
    // ============================================================
    function connect() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      const chat = getChatName();
      const sid = getSessionId(chat); // 每次连接都从 localStorage 取当前 chat 的 sessionId
      ws = new WebSocket(`${proto}://${location.host}/ws?resume_session_id=${encodeURIComponent(sid)}&chat=${encodeURIComponent(chat)}`);
      ws.onopen = () => { setStatus('online', '已连接'); reconnectDelay = 1000; };
      ws.onmessage = (e) => { try { handleServerMessage(JSON.parse(e.data)); } catch {} };
      ws.onclose = () => {
        setStatus('offline', '已断开，重连中…');
        finishGenerating();
        setTimeout(connect, reconnectDelay);
        reconnectDelay = Math.min(reconnectDelay * 1.5, 10000);
      };
      ws.onerror = () => setStatus('offline', '连接错误');
    }

    function setStatus(state, text) {
      $statusDot.className = 'dot ' + state;
      $statusText.textContent = text;
    }

    // ============================================================
    // 消息处理
    // ============================================================
    function handleServerMessage(msg) {
      switch (msg.type) {
        case 'token':       appendToken(msg.content || ''); break;
        case 'tool_call':   renderToolCall(msg.name, msg.args, msg.call_id); break;
        case 'tool_result': renderToolResult(msg.name, msg.result, msg.call_id); break;
        case 'approval':    renderApproval(msg.approval_id, msg.name, msg.content); break;
        case 'session':
          if (msg.session_id) {
            const chatName = getChatName();
            localStorage.setItem('cr_session_' + (chatName || 'default'), msg.session_id);
          }
          break;
        case 'done':        finishGenerating(msg.usage); break;
        case 'error':       renderError(msg.content || msg.message || '未知错误'); finishGenerating(); break;
      }
    }

    // ============================================================
    // Thinking（思维链）处理
    //
    // DeepSeek/Ark 的 reasoning_content 被后端用 <think>...</think> 包裹。
    // 我们在前端将其渲染为可折叠的"思考过程"块。
    // ============================================================
    let inThinking = false;       // 当前是否在 thinking 块内
    let thinkingEl = null;        // 当前 thinking 的 details 元素
    let thinkingContent = '';     // thinking 累积文本
    let thinkingStartTime = 0;    // thinking 开始时间（用于计时）

    function processThinkTags(text) {
      // 将流式 token 中的 <think> 和 </think> 标签分离处理
      const parts = [];
      let remaining = text;

      while (remaining.length > 0) {
        if (!inThinking) {
          const openIdx = remaining.indexOf('<think>');
          if (openIdx === -1) {
            parts.push({ type: 'text', content: remaining });
            remaining = '';
          } else {
            if (openIdx > 0) parts.push({ type: 'text', content: remaining.substring(0, openIdx) });
            parts.push({ type: 'think_open' });
            remaining = remaining.substring(openIdx + 7); // '<think>'.length = 7
            inThinking = true;
          }
        } else {
          const closeIdx = remaining.indexOf('</think>');
          if (closeIdx === -1) {
            parts.push({ type: 'thinking', content: remaining });
            remaining = '';
          } else {
            if (closeIdx > 0) parts.push({ type: 'thinking', content: remaining.substring(0, closeIdx) });
            parts.push({ type: 'think_close' });
            remaining = remaining.substring(closeIdx + 8); // '</think>'.length = 8
            inThinking = false;
          }
        }
      }
      return parts;
    }

    // ============================================================
    // 渲染
    // ============================================================
    function addUserMessage(text) {
      const el = createMessageEl('user', '我');
      el.querySelector('.bubble').textContent = text;
      $messages.appendChild(el);
      scrollToBottom();
    }

    function startAssistantMessage() {
      const el = createMessageEl('assistant', 'AI');
      const bubble = el.querySelector('.bubble');
      bubble.classList.add('cursor');
      $messages.appendChild(el);
      currentBubble = bubble;
      currentRaw = '';
      inThinking = false;
      thinkingEl = null;
      thinkingContent = '';
      scrollToBottom();
    }

    function appendToken(t) {
      if (!currentBubble) startAssistantMessage();

      const parts = processThinkTags(t);

      for (const part of parts) {
        switch (part.type) {
          case 'think_open':
            thinkingStartTime = Date.now();
            thinkingContent = '';
            // 创建 thinking 折叠块（绿色调，💭，流式时展开）
            thinkingEl = document.createElement('details');
            thinkingEl.className = 'block thinking-block';
            thinkingEl.open = true;
            thinkingEl.innerHTML =
              '<summary>' +
                '<span class="arrow">▶</span>' +
                '<span class="icon">💭</span>' +
                '<span class="title">思考中…</span>' +
                '<span class="meta-right"></span>' +
              '</summary>' +
              '<div class="thinking-content"></div>';
            currentBubble.appendChild(thinkingEl);
            break;

          case 'thinking':
            if (thinkingEl) {
              thinkingContent += part.content;
              thinkingEl.querySelector('.thinking-content').textContent = thinkingContent;
              // 自动滚动 thinking 内容到底部
              const tc = thinkingEl.querySelector('.thinking-content');
              tc.scrollTop = tc.scrollHeight;
            }
            break;

          case 'think_close':
            if (thinkingEl) {
              const duration = ((Date.now() - thinkingStartTime) / 1000).toFixed(1);
              thinkingEl.querySelector('.title').textContent = '已思考';
              thinkingEl.querySelector('.meta-right').textContent = duration + 's';
              thinkingEl.open = false; // 结束后自动折叠
              thinkingEl = null;
            }
            break;

          case 'text':
            if (part.content) {
              currentRaw += part.content;
              renderBubbleContent();
            }
            break;
        }
      }

      currentBubble.classList.add('cursor');
      scrollToBottom();
    }

    // 渲染 bubble 中的 markdown 正文（保留 thinking/tool 等已插入的子元素）
    function renderBubbleContent() {
      if (!currentBubble) return;

      // 找到或创建 markdown 容器（与 thinking-block/tool 等并列）
      let mdContainer = currentBubble.querySelector('.md-content');
      if (!mdContainer) {
        mdContainer = document.createElement('div');
        mdContainer.className = 'md-content';
        // 插入到最后一个 thinking 块之后
        const thinkings = currentBubble.querySelectorAll('.thinking-block');
        const lastThinking = thinkings.length ? thinkings[thinkings.length - 1] : null;
        if (lastThinking) lastThinking.after(mdContainer);
        else currentBubble.prepend(mdContainer);
      }

      mdContainer.innerHTML = renderMarkdown(currentRaw);
      addCopyButtons(mdContainer);
      highlightIn(mdContainer);
    }

    // ===== 代码块复制按钮 + 语言标签 =====
    function addCopyButtons(container) {
      container.querySelectorAll('pre:not(.wrapped)').forEach(pre => {
        pre.classList.add('wrapped');
        const code = pre.querySelector('code');
        if (!code) return;

        // 检测语言
        const langClass = Array.from(code.classList).find(c => c.startsWith('language-'));
        const lang = langClass ? langClass.replace('language-', '') : '';

        const wrapper = document.createElement('div');
        wrapper.className = 'code-block';

        const header = document.createElement('div');
        header.className = 'code-header';
        header.innerHTML = `<span class="lang">${escapeHtml(lang || 'code')}</span>`;

        const copyBtn = document.createElement('button');
        copyBtn.className = 'copy-btn';
        copyBtn.textContent = '复制';
        copyBtn.onclick = () => {
          const text = code.textContent;
          const done = () => {
            copyBtn.textContent = '已复制 ✓';
            copyBtn.classList.add('copied');
            setTimeout(() => { copyBtn.textContent = '复制'; copyBtn.classList.remove('copied'); }, 2000);
          };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
          } else {
            fallbackCopy(text, done);
          }
        };
        header.appendChild(copyBtn);

        pre.parentNode.insertBefore(wrapper, pre);
        wrapper.appendChild(header);
        wrapper.appendChild(pre);
      });
    }

    function fallbackCopy(text, done) {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (_) {}
      document.body.removeChild(ta);
      done();
    }

    // ===== 工具调用块（黄/橙色调，🔧，可折叠，含参数/结果区）=====
    function renderToolCall(name, args, callId) {
      const details = document.createElement('details');
      details.className = 'block tool-block';
      details.open = false;
      details.dataset.tool = name;
      details.dataset.callId = callId || '';
      details.innerHTML =
        '<summary>' +
          '<span class="arrow">▶</span>' +
          '<span class="icon">🔧</span>' +
          '<span class="title">调用工具：' + escapeHtml(name) + '</span>' +
          '<span class="meta-right">运行中…</span>' +
        '</summary>' +
        '<div class="tool-body">' +
          '<div class="section-label">参数</div>' +
          '<pre class="args">' + escapeHtml(pretty(args)) + '</pre>' +
          '<div class="result-section" hidden>' +
            '<div class="section-label result-label">结果</div>' +
            '<pre class="tool-result"></pre>' +
          '</div>' +
        '</div>';
      appendBlock(details);
    }

    // ===== 工具结果块（嵌套在工具调用块内部，灰色调）=====
    function renderToolResult(name, result, callId) {
      // 填充目标块的结果区。
      const fill = (b) => {
        const resultPre = b.querySelector('.tool-result');
        if (!resultPre) return false;
        resultPre.textContent = typeof result === 'string' ? result : pretty(result);
        b.querySelector('.result-section').hidden = false;
        resultPre.dataset.filled = '1';
        const mr = b.querySelector('.meta-right');
        if (mr) mr.textContent = '已完成';
        return true;
      };

      // 优先按 call ID 精确匹配，避免同名工具并发时错位。
      if (callId) {
        const block = $messages.querySelector(`.tool-block[data-call-id="${cssEscape(callId)}"]`);
        if (block) {
          fill(block);
          scrollToBottom();
          return;
        }
      }

      // 回退：按名称查找最后一个尚未填充的调用块。
      const blocks = $messages.querySelectorAll(`.tool-block[data-tool="${cssEscape(name)}"]`);
      for (let i = blocks.length - 1; i >= 0; i--) {
        const b = blocks[i];
        const resultPre = b.querySelector('.tool-result');
        if (resultPre && !resultPre.dataset.filled) {
          fill(b);
          break;
        }
      }
      scrollToBottom();
    }

    // ===== 审批块（橙色警告调，⚠️，批准/拒绝按钮）=====
    // activeApprovalId 跟踪当前活跃（最新）的审批块 ID。
    // 多个审批块同时存在时，全局键盘监听仅作用于当前活跃的那一个，避免 Y/N 误触其他块。
    let activeApprovalId = null;

    function renderApproval(id, name, args) {
      // 每次新审批到来时，将其设为当前活跃块。
      activeApprovalId = id;

      const box = document.createElement('div');
      box.className = 'approval';
      box.innerHTML =
        '<div class="head"><span>⚠️</span><span>需要审批：工具 ' + escapeHtml(name) + ' 请求执行</span></div>' +
        '<div class="section-label">参数</div>' +
        '<pre>' + escapeHtml(pretty(args)) + '</pre>' +
        '<div class="btns">' +
          '<button class="btn-success">✓ 批准 (Y)</button>' +
          '<button class="btn-danger">✗ 拒绝 (N)</button>' +
        '</div>';
      appendBlock(box);

      const respond = (approved) => {
        send({ type: 'approval', approval_id: id, approved });
        box.querySelector('.btns').innerHTML =
          `<span style="color:var(--text-dim)">${approved ? '✓ 已批准' : '✗ 已拒绝'} · ${formatTime()}</span>`;
        document.removeEventListener('keydown', keyHandler);
        // 若响应的是当前活跃块，则清空活跃标记。
        if (activeApprovalId === id) activeApprovalId = null;
      };
      box.querySelector('.btn-success').onclick = () => respond(true);
      box.querySelector('.btn-danger').onclick = () => respond(false);
      const keyHandler = (e) => {
        // 仅当前活跃审批块响应键盘事件。
        if (activeApprovalId !== id) return;
        if (e.key.toLowerCase() === 'y') respond(true);
        else if (e.key.toLowerCase() === 'n') respond(false);
      };
      document.addEventListener('keydown', keyHandler);
      scrollToBottom();
    }

    function renderError(text) {
      const el = document.createElement('div');
      el.className = 'msg assistant';
      el.innerHTML = `<div class="avatar" style="background:var(--danger)">!</div>
        <div class="content-wrap">
          <div class="meta"><span class="role">错误</span><span>${formatTime()}</span></div>
          <div class="bubble" style="border-color:var(--danger);color:var(--danger)">${escapeHtml(text)}</div>
        </div>`;
      $messages.appendChild(el);
      scrollToBottom();
    }

    function appendBlock(node) {
      if (!currentBubble) startAssistantMessage();
      currentBubble.classList.remove('cursor');
      currentBubble.appendChild(node);
      scrollToBottom();
    }

    function createMessageEl(role, label) {
      const el = document.createElement('div');
      el.className = 'msg ' + role;
      el.innerHTML = `
        <div class="avatar">${label}</div>
        <div class="content-wrap">
          <div class="meta">
            <span class="role">${role === 'user' ? '你' : '助手'}</span>
            <span>${formatTime()}</span>
          </div>
          <div class="bubble"></div>
        </div>`;
      return el;
    }

    // ============================================================
    // 发送与控制
    // ============================================================
    function send(obj) { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj)); }

    function sendChat() {
      const text = $input.value.trim();
      if (!text || generating) return;
      if (!ws || ws.readyState !== WebSocket.OPEN) { renderError('连接尚未就绪，请稍候…'); return; }
      addUserMessage(text);
      $input.value = '';
      autoResize();
      startGenerating();
      startAssistantMessage();
      send({ type: 'chat', content: text });
    }

    function startGenerating() { generating = true; $stopBtn.disabled = false; $sendBtn.disabled = true; }

    function finishGenerating(usage) {
      generating = false;
      $stopBtn.disabled = true;
      $sendBtn.disabled = false;
      if (currentBubble) {
        currentBubble.classList.remove('cursor');
        // 最终渲染一次确保完整
        if (currentRaw) renderBubbleContent();
      }
      currentBubble = null;
      currentRaw = '';
      inThinking = false;
      thinkingEl = null;
      if (usage) console.log('[usage]', usage);
    }

    $sendBtn.onclick = sendChat;
    $stopBtn.onclick = () => send({ type: 'stop' });
    $clearBtn.onclick = () => { if (!confirm('确定清空当前对话？')) return; $messages.innerHTML = ''; send({ type: 'clear' }); };
    $newBtn.onclick = () => {
      // 新建会话：删除当前 chat 的 sessionId，connect() 会自动生成新 UUID
      localStorage.removeItem('cr_session_' + getChatName());
      $messages.innerHTML = '';
      finishGenerating();
      if (ws) { ws.onclose = null; ws.close(); }
      ws = null;
      reconnectDelay = 1000;
      connect();
    };
    $input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); } });
    $input.addEventListener('input', autoResize);
    function autoResize() { $input.style.height = 'auto'; $input.style.height = Math.min($input.scrollHeight, 200) + 'px'; }

    // ============================================================
    // 工具函数
    // ============================================================
    function scrollToBottom() {
      const nearBottom = $main.scrollHeight - $main.scrollTop - $main.clientHeight < 120;
      if (nearBottom) requestAnimationFrame(() => { $main.scrollTop = $main.scrollHeight; });
    }

    // sanitizeHtml 使用浏览器 DOM 去除 XSS 载体：危险标签、事件属性、javascript: URL。
    // marked.parse() 输出的 HTML 必须经过此函数才能赋值给 innerHTML。
    function sanitizeHtml(html) {
      const tmp = document.createElement('div');
      tmp.innerHTML = html;
      const dangerousTags = ['script', 'style', 'iframe', 'object', 'embed', 'form', 'base', 'link', 'meta'];
      dangerousTags.forEach(tag => tmp.querySelectorAll(tag).forEach(el => el.remove()));
      tmp.querySelectorAll('*').forEach(el => {
        Array.from(el.attributes).forEach(attr => {
          const name = attr.name.toLowerCase();
          // 移除所有事件处理属性（onclick、onerror 等）
          if (name.startsWith('on')) { el.removeAttribute(attr.name); return; }
          // 移除 href/src/action 中的 javascript: 伪协议
          if (['href', 'src', 'action', 'formaction', 'xlink:href'].includes(name) &&
              /^\s*javascript\s*:/i.test(attr.value)) {
            el.removeAttribute(attr.name);
          }
        });
      });
      return tmp.innerHTML;
    }

    function renderMarkdown(text) {
      if (window.marked) return sanitizeHtml(marked.parse(text, { breaks: true, gfm: true }));
      return escapeHtml(text).replace(/\n/g, '<br>');
    }

    function highlightIn(el) {
      if (!window.hljs) return;
      el.querySelectorAll('pre code:not([data-hl])').forEach((b) => { hljs.highlightElement(b); b.dataset.hl = '1'; });
    }

    function pretty(v) { if (v == null) return ''; try { return typeof v === 'string' ? v : JSON.stringify(v, null, 2); } catch { return String(v); } }
    function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function escapeAttr(s) { return String(s).replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
    function cssEscape(s) { return String(s).replace(/["\\]/g, '\\$&'); }

    // ============================================================
    // 启动
    // ============================================================
    window.addEventListener('DOMContentLoaded', () => {
      setStatus('offline', '连接中…');
      loadChats().then(() => connect());
      $input.focus();
    });
  </script>
</body>
</html>
