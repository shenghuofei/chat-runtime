# OpenAI 配置模板
# 适用于: GPT-4o / GPT-4o-mini / o1 / o3 等
# 文档: https://platform.openai.com/docs/api-reference

providers:
  openai:
    type: openai
    api_key: "${OPENAI_API_KEY}"
    # base_url: "https://api.openai.com/v1"   # 默认值，可省略

models:
  gpt4o:
    provider: openai
    model: gpt-4o
    # temperature: 0.7
    # max_tokens: 4096

chats:
  default:
    default: true
    model: gpt4o
    system: "你是一个有用的助手，回答简洁准确。"
