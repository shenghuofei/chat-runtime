# Claude (Anthropic) 配置模板
# 适用于: claude-sonnet-4 / claude-opus-4 / claude-haiku 等
# 文档: https://docs.anthropic.com/en/api/messages
#
# 注意事项:
#   - Claude 必须显式设置 max_tokens（无默认值），框架默认填 4096
#   - 鉴权使用 x-api-key 头（非 Bearer token），框架自动处理
#   - system prompt 会自动放到请求体顶层字段（非 messages 数组）

providers:
  claude:
    type: claude
    api_key: "${CLAUDE_API_KEY}"
    # base_url: "https://api.anthropic.com"   # 默认值，可省略
    # 如果使用代理网关:
    # base_url: "https://your-proxy.example.com"

models:
  sonnet:
    provider: claude
    model: claude-sonnet-4-20250514
    max_tokens: 4096
    # temperature: 0.7

  opus:
    provider: claude
    model: claude-opus-4-20250514
    max_tokens: 8192

chats:
  default:
    default: true
    model: sonnet
    system: "你是一个有用的助手，回答简洁准确。"
