# Ollama 本地部署配置模板
# 适用于: llama3 / qwen2 / deepseek-v2 / mistral / codellama 等本地模型
# 文档: https://ollama.com/
#
# 前提: 本地已安装并启动 Ollama
#   brew install ollama          # macOS
#   ollama serve                 # 启动服务
#   ollama pull llama3.1         # 下载模型
#
# 注意事项:
#   - 不需要 API Key（本地运行）
#   - 默认监听 http://localhost:11434
#   - 使用 OpenAI 兼容接口（/v1/chat/completions）
#   - 工具调用支持取决于模型（llama3.1+ / qwen2+ 支持）

providers:
  ollama:
    type: ollama
    # api_key 不需要
    # base_url: "http://localhost:11434/v1"   # 默认值
    # 如果 Ollama 跑在远程机器:
    # base_url: "http://192.168.1.100:11434/v1"

models:
  llama:
    provider: ollama
    model: llama3.1
    temperature: 0.7

  qwen:
    provider: ollama
    model: qwen2:7b

  codellama:
    provider: ollama
    model: codellama:13b

chats:
  default:
    default: true
    model: llama
    system: "你是一个有用的助手，回答简洁准确。"

  coding:
    model: codellama
    system: "你是一个编程助手，帮助用户编写和调试代码。"
