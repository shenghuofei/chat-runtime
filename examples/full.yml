# full.yml —— 完整配置参考（含全部选项与注释）
#
# 本文件罗列 chat-runtime 支持的所有配置项，并逐一注释说明。
# 直接使用时请按需裁剪，删除不需要的段落。
# 字段的详细语义见 docs/configuration.md。
#
# 约定：所有密钥/敏感信息均通过 ${ENV_VAR} 环境变量注入，避免明文入库。

# ============================================================
# providers —— LLM 提供商定义（连接凭证 / endpoint）
# key 为自定义名称，供 models 引用。
# ============================================================
providers:
  openai:
    type: openai                       # Provider 类型
    api_key: ${OPENAI_API_KEY}         # API 密钥（环境变量注入）
    base_url: https://api.openai.com/v1 # 可选：自定义 endpoint（代理/兼容网关）
    timeout: 60s                       # 可选：请求超时

  claude:
    type: claude
    api_key: ${ANTHROPIC_API_KEY}      # Claude 支持 Prompt Cache

  deepseek:
    type: deepseek
    api_key: ${DEEPSEEK_API_KEY}
    base_url: https://api.deepseek.com

  ollama:
    type: ollama
    base_url: http://localhost:11434   # 本地模型，无需 api_key

  ark:
    type: ark                          # 火山引擎方舟
    api_key: ${ARK_API_KEY}

  gemini:
    type: gemini
    api_key: ${GEMINI_API_KEY}

  qwen:
    type: qwen                         # 通义千问（OpenAI 兼容）
    api_key: ${DASHSCOPE_API_KEY}
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1

# ============================================================
# models —— 模型定义（绑定 provider + 模型名 + 采样参数）
# key 为自定义名称，供 chats 引用。
# ============================================================
models:
  default:
    provider: deepseek                 # 引用 providers 中的名称
    model: deepseek-chat               # Provider 侧实际模型标识
    temperature: 0.7                   # 可选：采样温度 0~2
    max_tokens: 4096                   # 可选：单次响应最大生成 token
    top_p: 1.0                         # 可选：核采样

  smart:
    provider: openai
    model: gpt-4o
    temperature: 0.3

  claude-model:
    provider: claude
    model: claude-3-5-sonnet-latest

# ============================================================
# chats —— 对话定义（绑定 model + system + 工具/上下文策略）
# 默认加载名为 default 的对话。
# ============================================================
chats:
  default:
    model: default                     # 引用 models 中的名称
    # system 支持：内联文本 / @file: 文件引用 / Go 模板变量
    # 可用变量：{{.Cwd}} 工作目录  {{.Date}} 日期  {{.User}} 用户名  {{.Home}} 主目录
    system: |
      你是运行在 {{.User}} 本地环境的助手。
      工作目录：{{.Cwd}}，主目录：{{.Home}}，当前日期：{{.Date}}。
      给出文件路径时优先使用相对工作目录的相对路径。
    tools:                             # 可选：限定该对话可用的工具，缺省为全部
      - command
      - filesystem
    mcp_servers:                       # 可选：限定该对话启用的 MCP Server，缺省为全部
      - k8s-eye
    context_manager:                   # 可选：覆盖全局 context_manager
      mode: truncate
      max_rounds: 30

  # 通过 @file: 从外部文件加载 system（文件内容同样会被模板渲染）
  devops:
    model: smart
    system: "@file:./prompts/devops.md"
    mcp_servers:
      - k8s-eye

# ============================================================
# mcp_servers —— MCP 工具来源
# 工具以 <server_name>__<tool_name> 形式暴露给模型。
# ============================================================
mcp_servers:
  # stdio：本地子进程
  k8s-eye:
    transport: stdio                   # 传输方式：stdio / sse / streamable-http
    command: ./k8s-eye                 # stdio：要启动的可执行文件
    args: ["--verbose"]                # stdio：可选命令行参数
    env:                               # stdio：可选，注入子进程的环境变量
      KUBECONFIG: ${HOME}/.kube/config
    # auto_approve 审批策略：
    #   true          -> 全部工具自动批准（仅限可信/只读）
    #   [toolA, ...]  -> 仅列出的工具自动批准，其余需审批
    #   false / 省略  -> 全部需人工审批（最安全）
    auto_approve:
      - get_pods
      - describe_pod
    include: []                        # 可选：白名单，仅暴露列出的工具
    exclude:                           # 可选：黑名单，屏蔽列出的工具
      - delete_namespace
    no_concurrent: false               # 可选：true 则该 Server 所有工具串行执行
    no_concurrent_tools:               # 可选：仅这些工具之间串行
      - apply_changes

  # sse：远程 HTTP（Server-Sent Events）
  web-search:
    transport: sse
    url: https://your-mcp-host/sse     # sse/http：服务地址
    headers:                           # sse/http：可选自定义请求头（鉴权等）
      Authorization: Bearer ${MCP_TOKEN}
    auto_approve:
      - search

  # streamable-http：远程 HTTP（推荐的现代远程传输）
  data-api:
    transport: streamable-http
    url: https://your-mcp-host/mcp
    headers:
      Authorization: Bearer ${MCP_TOKEN}
    include:                           # 只暴露这两个工具
      - query_metric
      - list_dashboards

# ============================================================
# tools —— 内置工具配置
# ============================================================
tools:
  command:                             # 命令执行工具（风险最高，建议白名单 + 审批）
    enabled: true
    whitelist:                         # 命令白名单，仅允许列出的命令
      - ls
      - cat
      - grep
      - kubectl
    # auto_approve 规则同 mcp_servers：true / [cmd...] / false
    auto_approve:                      # 只读命令自动批准，其余需审批
      - ls
      - cat
      - grep
    timeout: 30s                       # 单条命令超时

  filesystem:                          # 文件操作工具
    enabled: true
    root: ./workspace                  # 限定的根目录，越界访问被拒绝
    readonly: false                    # true 则禁止写入/删除

# ============================================================
# context_manager —— 上下文溢出策略（全局默认，可被 chats 覆盖）
# mode: compress / truncate / window，三选一。
# ============================================================
context_manager:
  mode: compress                       # compress：摘要压缩早期历史
  # ---- compress 相关 ----
  max_tokens: 32000                    # 达到该 token 阈值触发压缩
  compress_ratio: 0.5                  # 压缩目标比例（压缩到约一半）
  # ---- truncate 相关（mode: truncate 时使用）----
  # max_rounds: 20                     # 保留的最大对话轮次
  # ---- window 相关（mode: window 时使用）----
  # max_tokens: 16000                  # token 滑动窗口上限

# ============================================================
# server —— Web 服务模式配置（serve 子命令）
# 命令行参数（如 --port）优先级高于此处。
# ============================================================
server:
  host: 0.0.0.0                        # 监听地址（默认 0.0.0.0）
  port: 8080                           # 监听端口（默认 8080）
  basic_auth:                          # HTTP Basic Auth（公网暴露务必启用）
    enabled: true
    username: admin
    password: ${WEB_PASSWORD}          # 密码用环境变量注入
